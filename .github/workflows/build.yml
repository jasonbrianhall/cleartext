name: Build ClearText

on:
  push:
    branches: [ main, dev ]
    paths:
      - '**.cpp'
      - '**.h'
      - 'Makefile'
      - '**/Makefile'
      - '**.yml'
      - '**.yaml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - '**.cpp'
      - '**.h'
      - 'Makefile'
      - '**/Makefile'
      - '**.yml'
      - '**.yaml'
  workflow_dispatch:

env:
  PRODUCT_VERSION: "1.0.${{ github.run_number }}.0"
  UPGRADE_CODE: "0FEACE4E-5DB7-401E-BC63-371C58E2735D"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    outputs:
      version: ${{ env.PRODUCT_VERSION }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        dnf -y install \
          gcc gcc-c++ make \
          pkg-config \
          mingw64-gcc mingw64-gcc-c++ \
          mingw64-wxWidgets3 \
          zip unzip \
          ImageMagick

    - name: Convert PNG Icon to ICO Format
      run: |
        if [ -f "icon.png" ]; then
          echo "Converting icon.png to icon.ico..."
          convert icon.png -resize 256x256 -colors 256 icon.ico
          echo "✅ Icon converted successfully"
          ls -lh icon.ico
        else
          echo "⚠️  icon.png not found at repo root — exe will use the default icon"
        fi

    - name: Build Windows Executable
      run: |
        make windows

    - name: Prepare Build Artifacts
      working-directory: build/windows
      run: |
        cp ../../README.md . 2>/dev/null || true
        cp ../../LICENSE.md . 2>/dev/null || true
        cp ../../icon.png . 2>/dev/null || true
        cp ../../icon.ico . 2>/dev/null || true

        if [ ! -f "cleartext.exe" ]; then
          echo "❌ ERROR: cleartext.exe not found!"
          ls -la
          exit 1
        fi
        echo "✅ cleartext.exe found"

        # DLLs are already collected here — `make windows` runs
        # collect_dlls.sh automatically right after linking.
        echo "📦 Portable package contents:"
        ls -lh *.exe *.dll 2>/dev/null || true

        zip -r ../../ClearText-Portable.zip ./*

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cleartext-build
        path: ClearText-Portable.zip
        retention-days: 7

  build-windows-msvc:
    runs-on: windows-latest
    needs: build-linux
    outputs:
      version: ${{ needs.build-linux.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        echo "VCPKG_ROOT=$PWD\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install wxWidgets (static)
      run: |
        ${{ env.VCPKG_ROOT }}\vcpkg install wxwidgets:x64-windows-static

    - name: Convert PNG Icon to ICO Format
      run: |
        if (Test-Path "icon.png") {
          magick icon.png -resize 256x256 -colors 256 icon.ico
        } else {
          Write-Host "icon.png not found — exe will use the default icon"
        }

    - name: Configure (CMake)
      run: |
        cmake -B build -S . -A x64 `
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows-static

    - name: Build (Visual Studio / MSBuild via CMake)
      run: |
        cmake --build build --config Release

    - name: Prepare Build Artifacts
      run: |
        New-Item -ItemType Directory -Force -Path "package"
        Copy-Item "build\Release\cleartext.exe" "package\"
        Copy-Item "README.md" "package\" -ErrorAction SilentlyContinue
        Copy-Item "LICENSE.md" "package\" -ErrorAction SilentlyContinue
        Copy-Item "icon.png" "package\" -ErrorAction SilentlyContinue
        Copy-Item "icon.ico" "package\" -ErrorAction SilentlyContinue

        if (-not (Test-Path "package\cleartext.exe")) {
          Write-Error "cleartext.exe not found!"
          exit 1
        }

        Write-Host "Static MSVC build — DLL dependencies:"
        dumpbin /dependents "package\cleartext.exe" | Select-String "\.dll"

        Compress-Archive -Path "package\*" -DestinationPath "ClearText-MSVC-Portable.zip"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cleartext-build-msvc
        path: ClearText-MSVC-Portable.zip
        retention-days: 7

  build-msi-windows:
    needs: build-windows-msvc
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: cleartext-build-msvc
        path: .

    - name: Extract Build Files
      run: |
        Expand-Archive -Path "ClearText-MSVC-Portable.zip" -DestinationPath "artifacts/build/windows/" -Force

    - name: Setup WiX Toolset
      run: |
        Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -OutFile "wix.zip"
        Expand-Archive -Path "wix.zip" -DestinationPath "wix"
        echo "$env:GITHUB_WORKSPACE\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Generate MSI Installer
      working-directory: artifacts/build/windows
      run: |
        $version = "${{ env.PRODUCT_VERSION }}"
        $upgradeCode = "${{ env.UPGRADE_CODE }}"

        # Generate component entries for all DLLs
        $dllEntries = Get-ChildItem -Name "*.dll" | ForEach-Object {
          $safeId = $_ -replace '[^a-zA-Z0-9]', '_'
          "                <File Id=`"$safeId`" Name=`"$_`" Source=`"$_`"/>"
        }

        @"
        <?xml version="1.0" encoding="UTF-8"?>
        <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">

          <Product Id="*"
                   Name="ClearText"
                   Language="1033"
                   Version="$version"
                   Manufacturer="ClearText"
                   UpgradeCode="$upgradeCode">

            <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine"
                     Description="ClearText - a lightweight multi-tab text editor"
                     Manufacturer="ClearText" />

            <MajorUpgrade DowngradeErrorMessage="A newer version of ClearText is already installed."
                          Schedule="afterInstallInitialize" />
            <MediaTemplate EmbedCab="yes" CompressionLevel="high" />

            <Icon Id="ClearTextIcon" SourceFile="icon.ico" />
            <Property Id="ARPPRODUCTICON" Value="ClearTextIcon" />
            <Property Id="ARPHELPLINK" Value="https://github.com/cleartext-editor" />
            <Property Id="ARPURLINFOABOUT" Value="https://github.com/cleartext-editor" />
            <Property Id="ARPCOMMENTS" Value="A lightweight, multi-tab text editor" />

            <WixVariable Id="WixUILicenseRtf" Value="License.rtf" />
            <Property Id="WIXUI_INSTALLDIR" Value="INSTALLFOLDER" />
            <Property Id="DESKTOP_SHORTCUT" Value="1" />

            <Directory Id="TARGETDIR" Name="SourceDir">
              <Directory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLFOLDER" Name="ClearText" />
              </Directory>
              <Directory Id="ProgramMenuFolder">
                <Directory Id="ApplicationProgramsFolder" Name="ClearText" />
              </Directory>
              <Directory Id="DesktopFolder" />
            </Directory>

            <!-- Main executable and all DLL dependencies -->
            <DirectoryRef Id="INSTALLFOLDER">
              <Component Id="MainExecutable" Guid="302A8A1D-223C-4500-A45C-4B5F5A76D91D" Win64="yes">
                <File Id="clearText_exe" Name="cleartext.exe" Source="cleartext.exe" />

                <!-- Start Menu shortcut (non-advertised, points at ApplicationProgramsFolder) -->
                <Shortcut Id="StartMenuShortcut"
                          Directory="ApplicationProgramsFolder"
                          Name="ClearText"
                          Description="ClearText - a lightweight multi-tab text editor"
                          Target="[INSTALLFOLDER]cleartext.exe"
                          WorkingDirectory="INSTALLFOLDER"
                          Icon="ClearTextIcon"
                          IconIndex="0" />

                <!-- Registry KeyPath required for non-advertised shortcuts -->
                <RegistryValue Root="HKCU" Key="Software\ClearText" Name="installed"
                               Type="integer" Value="1" KeyPath="yes" />

                <!-- DLL dependencies -->
                $($dllEntries -join "`r`n")
              </Component>
            </DirectoryRef>

            <!-- Start Menu folder cleanup on uninstall (fixes ICE64) -->
            <DirectoryRef Id="ApplicationProgramsFolder">
              <Component Id="StartMenuFolder" Guid="2DF58780-5A3B-4A0C-8864-134353DC5E82" Win64="yes">
                <RemoveFolder Id="ApplicationProgramsFolderRemove" On="uninstall" />
                <RegistryValue Root="HKCU" Key="Software\ClearText\Shortcuts" Name="StartMenu"
                               Type="integer" Value="1" KeyPath="yes" />
              </Component>
            </DirectoryRef>

            <!-- Desktop shortcut (optional) -->
            <DirectoryRef Id="DesktopFolder">
              <Component Id="DesktopShortcut" Guid="E10A85C7-97CF-4273-82BC-24DCBF255D73" Win64="yes">
                <Condition>DESKTOP_SHORTCUT=1</Condition>
                <Shortcut Id="DesktopShortcutMain"
                          Directory="DesktopFolder"
                          Name="ClearText"
                          Description="ClearText - a lightweight multi-tab text editor"
                          Target="[INSTALLFOLDER]cleartext.exe"
                          WorkingDirectory="INSTALLFOLDER"
                          Icon="ClearTextIcon"
                          IconIndex="0" />

                <RegistryValue Root="HKCU" Key="Software\ClearText\Shortcuts" Name="Desktop"
                               Type="integer" Value="1" KeyPath="yes" />
              </Component>
            </DirectoryRef>

            <Feature Id="MainFeature" Title="ClearText" Level="1">
              <ComponentRef Id="MainExecutable" />
              <ComponentRef Id="StartMenuFolder" />
              <ComponentRef Id="DesktopShortcut" />
            </Feature>

            <UIRef Id="WixUI_InstallDir" />
            <UIRef Id="WixUI_ErrorProgressText" />

            <InstallExecuteSequence>
              <Custom Action="SetARPINSTALLLOCATION" After="InstallValidate" />
            </InstallExecuteSequence>
            <CustomAction Id="SetARPINSTALLLOCATION" Property="ARPINSTALLLOCATION" Value="[INSTALLFOLDER]" />

          </Product>
        </Wix>
        "@ | Out-File -FilePath "cleartext.wxs" -Encoding UTF8

        # Create RTF license if not present
        if (-not (Test-Path "License.rtf")) {
          @"
        {\rtf1\ansi\ansicpg1252
        {\colortbl;\red255\green255\blue255;}
        \margl1440\margr1440\vieww11900\viewh8605\viewkind0
        \pard\tx720\tx1440\tx2160\tx2880\tx3600\tx4320\pardirnatural\partightenfactor0
        \f0\fs20 \cf0 MIT License\
        \
        Copyright (c) 2026 ClearText Contributors\
        \
        Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions:\
        \
        The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software.\
        \
        THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.}
        "@ | Out-File -FilePath "License.rtf" -Encoding ASCII
        }

        Write-Host "Compiling WXS..."
        & candle.exe -out "cleartext.wixobj" -arch x64 "cleartext.wxs"
        if ($LASTEXITCODE -ne 0) { Write-Error "Candle failed"; exit 1 }

        Write-Host "Linking MSI..."
        & light.exe -out "ClearText.msi" -ext WixUIExtension -ext WixUtilExtension "cleartext.wixobj"
        if ($LASTEXITCODE -ne 0) { Write-Error "Light failed"; exit 1 }

        if (Test-Path "ClearText.msi") {
          Write-Host "✅ MSI created: ClearText.msi ($((Get-Item 'ClearText.msi').Length) bytes)"
        } else {
          Write-Error "❌ MSI not created"; exit 1
        }

    - name: Upload MSI
      uses: actions/upload-artifact@v4
      with:
        name: ClearText.msi
        path: artifacts/build/windows/ClearText.msi
        retention-days: 7

  build-msix-windows:
    needs: build-windows-msvc
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: cleartext-build-msvc
        path: .

    - name: Extract Build Files
      run: |
        Expand-Archive -Path "ClearText-MSVC-Portable.zip" -DestinationPath "msix-source\" -Force

    - name: Prepare MSIX Package Structure
      run: |
        New-Item -ItemType Directory -Force -Path "msix-package/Assets"
        New-Item -ItemType Directory -Force -Path "msix-package/Files"

        Copy-Item "msix-source/*" -Destination "msix-package/Files/" -Recurse -Force

        if (-not (Test-Path "msix-package/Files/cleartext.exe")) {
          Write-Error "cleartext.exe not found in package!"
          exit 1
        }

        Write-Host "✅ cleartext.exe verified in MSIX package"
        Write-Host "📦 MSIX Files directory contents:"
        Get-ChildItem "msix-package/Files/" -File | ForEach-Object {
          $size = "{0:N0}" -f $_.Length
          Write-Host "  - $($_.Name) ($size bytes)"
        }

    - name: Create MSIX Store Compliant Assets
      run: |
        $iconPath = "msix-source/icon.png"

        if (-not (Test-Path $iconPath)) {
          Write-Error "icon.png not found - cannot create Store assets"
          exit 1
        }

        Write-Host "Creating Microsoft Store compliant assets..."

        # StoreLogo (50x50 base)
        & magick "$iconPath" -resize 50x50   "msix-package/Assets/StoreLogo.scale-100.png"
        & magick "$iconPath" -resize 63x63   "msix-package/Assets/StoreLogo.scale-125.png"
        & magick "$iconPath" -resize 75x75   "msix-package/Assets/StoreLogo.scale-150.png"
        & magick "$iconPath" -resize 100x100 "msix-package/Assets/StoreLogo.scale-200.png"

        # Square 44x44 (small tile)
        & magick "$iconPath" -resize 44x44 "msix-package/Assets/ClearText44x44.scale-100.png"
        & magick "$iconPath" -resize 55x55 "msix-package/Assets/ClearText44x44.scale-125.png"
        & magick "$iconPath" -resize 66x66 "msix-package/Assets/ClearText44x44.scale-150.png"
        & magick "$iconPath" -resize 88x88 "msix-package/Assets/ClearText44x44.scale-200.png"

        # Square 150x150 (main tile)
        & magick "$iconPath" -resize 150x150 "msix-package/Assets/ClearTextLogo.scale-100.png"
        & magick "$iconPath" -resize 188x188 "msix-package/Assets/ClearTextLogo.scale-125.png"
        & magick "$iconPath" -resize 225x225 "msix-package/Assets/ClearTextLogo.scale-150.png"
        & magick "$iconPath" -resize 300x300 "msix-package/Assets/ClearTextLogo.scale-200.png"

        # Wide 310x150 (wide tile)
        & magick "$iconPath" -resize 150x150 -background "#0d1117" -gravity center -extent 310x150 "msix-package/Assets/ClearTextWide.scale-100.png"
        & magick "$iconPath" -resize 188x188 -background "#0d1117" -gravity center -extent 388x188 "msix-package/Assets/ClearTextWide.scale-125.png"
        & magick "$iconPath" -resize 225x225 -background "#0d1117" -gravity center -extent 465x225 "msix-package/Assets/ClearTextWide.scale-150.png"
        & magick "$iconPath" -resize 300x300 -background "#0d1117" -gravity center -extent 620x300 "msix-package/Assets/ClearTextWide.scale-200.png"

        Write-Host "✅ All Microsoft Store assets created successfully"

    - name: Create MSIX Manifest
      working-directory: msix-package
      run: |
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                 xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                 xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">

          <Identity
            Name="JasonBrianHall.ClearText"
            Publisher="CN=7A3CF65F-504C-42F2-BABD-6A0512A0A017"
            Version="${{ needs.build-windows-msvc.outputs.version }}"
            ProcessorArchitecture="x64" />

          <Properties>
            <DisplayName>ClearText</DisplayName>
            <PublisherDisplayName>Jason Brian Hall</PublisherDisplayName>
            <Description>A lightweight, multi-tab text editor.</Description>
            <Logo>Assets\StoreLogo.scale-100.png</Logo>
          </Properties>

          <Dependencies>
            <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.26100.0" />
          </Dependencies>

          <Resources>
            <Resource Language="en-us" />
          </Resources>

          <Applications>
            <Application Id="ClearText" Executable="Files\cleartext.exe" EntryPoint="Windows.FullTrustApplication">
              <uap:VisualElements DisplayName="ClearText"
                                  Description="A lightweight, multi-tab text editor."
                                  Square150x150Logo="Assets\ClearTextLogo.scale-100.png"
                                  Square44x44Logo="Assets\ClearText44x44.scale-100.png"
                                  BackgroundColor="#0d1117">
                <uap:DefaultTile Wide310x150Logo="Assets\ClearTextWide.scale-100.png"
                                 ShortName="ClearText">
                  <uap:ShowNameOnTiles>
                    <uap:ShowOn Tile="square150x150Logo"/>
                    <uap:ShowOn Tile="wide310x150Logo"/>
                  </uap:ShowNameOnTiles>
                </uap:DefaultTile>
                <uap:SplashScreen Image="Assets\ClearTextLogo.scale-100.png" />
              </uap:VisualElements>
            </Application>
          </Applications>

          <Capabilities>
            <rescap:Capability Name="runFullTrust" />
          </Capabilities>
        </Package>
        "@ | Out-File -FilePath "AppxManifest.xml" -Encoding UTF8

    - name: Build MSIX Package
      run: |
        $makeAppxPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64\makeappx.exe"

        if (-not (Test-Path $makeAppxPath)) {
          $sdkVersions = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\" |
            Where-Object { $_.Name -match "10\.0\.\d+\.\d+" } |
            Sort-Object Name -Descending
          foreach ($version in $sdkVersions) {
            $testPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$($version.Name)\x64\makeappx.exe"
            if (Test-Path $testPath) { $makeAppxPath = $testPath; break }
          }
        }

        if (-not (Test-Path $makeAppxPath)) {
          Write-Error "MakeAppx.exe not found."
          exit 1
        }

        Write-Host "Using MakeAppx at: $makeAppxPath"
        & "$makeAppxPath" pack /d "msix-package" /p "ClearText.msix" /o

        if ($LASTEXITCODE -ne 0) { Write-Error "MSIX creation failed"; exit 1 }

        if (Test-Path "ClearText.msix") {
          Write-Host "✅ MSIX created: ClearText.msix ($((Get-Item 'ClearText.msix').Length) bytes)"
          Write-Host "Package is unsigned and ready for Microsoft Store submission"
        } else {
          Write-Error "❌ MSIX not created"; exit 1
        }

    - name: Upload MSIX
      uses: actions/upload-artifact@v4
      with:
        name: ClearText.msix
        path: ClearText.msix
        retention-days: 7

  create-release:
    needs: [build-linux, build-windows-msvc, build-msi-windows, build-msix-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push'

    steps:
    - name: Download MSI Artifact
      uses: actions/download-artifact@v4
      with:
        name: ClearText.msi
        path: release

    - name: Download MSIX Artifact
      uses: actions/download-artifact@v4
      with:
        name: ClearText.msix
        path: release

    - name: Download Portable Artifact
      uses: actions/download-artifact@v4
      with:
        name: cleartext-build
        path: release

    - name: Download MSVC Portable Artifact
      uses: actions/download-artifact@v4
      with:
        name: cleartext-build-msvc
        path: release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/ClearText.msi
          release/ClearText.msix
          release/ClearText-Portable.zip
          release/ClearText-MSVC-Portable.zip
        tag_name: ${{ github.ref == 'refs/heads/main' && format('v{0}', github.run_number) || format('dev-v{0}', github.run_number) }}
        name: ${{ github.ref == 'refs/heads/main' && format('Release v{0}', github.run_number) || format('Dev Build v{0}', github.run_number) }}
        draft: false
        prerelease: ${{ github.ref != 'refs/heads/main' }}
        make_latest: ${{ github.ref == 'refs/heads/main' }}
        body: |
          ## ${{ github.ref == 'refs/heads/main' && 'Stable Release' || 'Development Build' }}

          **Version:** ${{ needs.build-linux.outputs.version }}
          **Commit:** ${{ github.sha }}
          **Build:** #${{ github.run_number }}

          ### 📝 ClearText
          A lightweight, multi-tab text editor for Windows and Linux.

          ### 📦 Downloads
          - **ClearText.msi** — Windows installer with Start Menu and optional desktop shortcuts
          - **ClearText.msix** — Unsigned package ready for Microsoft Store submission
          - **ClearText-Portable.zip** — Portable version (mingw build), no installation required
          - **ClearText-MSVC-Portable.zip** — Portable version (MSVC static build), no installation required, no bundled DLLs

          ### ✨ Installer Features (MSI)
          - ✅ Start Menu shortcut
          - ✅ Optional desktop shortcut
          - ✅ Custom installation directory
          - ✅ Proper uninstall support
          - ✅ Add/Remove Programs integration

          ### 🏪 Microsoft Store Submission
          The MSIX package is **unsigned** and ready for submission via Partner Center. Before uploading:
          1. Update the `Identity Name` and `Publisher` in the manifest with your Partner Center values
          2. Upload the unsigned MSIX — Microsoft handles signing during certification

          ### 📦 Package Comparison
          | Feature | MSI | MSIX | Portable |
          |---------|-----|------|----------|
          | Installation Required | Yes | Yes | No |
          | Start Menu Integration | ✅ | ✅ | ❌ |
          | Auto-Update Support | ❌ | ✅ | ❌ |
          | Microsoft Store Ready | ❌ | ✅ | ❌ |
          | Sandboxed | ❌ | ✅ | ❌ |
          | Traditional Uninstall | ✅ | ✅ | ❌ |
          | Code Signing Required | ✅ | Store | ❌ |

          ### 🚀 Usage
          Launch **cleartext.exe** from the Start Menu or desktop shortcut. It's a single self-contained executable — no companion binaries required.

          ### 🎯 Silent Installation (MSI)
          ```cmd
          msiexec /i ClearText.msi /quiet /norestart
          msiexec /i ClearText.msi /quiet /norestart DESKTOP_SHORTCUT=1
          msiexec /x ClearText.msi /quiet /norestart
          ```

          ---
          *Built with ❤️ using GitHub Actions*
